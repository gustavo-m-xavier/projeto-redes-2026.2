services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: rede-monitor-server
    network_mode: host
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
      SERVER_PORT: ${SERVER_PORT:-9000}
      API_PORT: ${API_PORT:-8000}
      AUTH_TOKEN: ${AUTH_TOKEN:?Defina AUTH_TOKEN em .env}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-eth0}
    restart: unless-stopped

  client:
    build:
      context: ./client
    container_name: rede-monitor-client
    environment:
      SERVER_HOST: ${SERVER_HOST:-127.0.0.1}
      SERVER_PORT: ${SERVER_PORT:-9000}
      API_PORT: ${API_PORT:-8000}
      AUTH_TOKEN: ${AUTH_TOKEN:?Defina AUTH_TOKEN em .env}
      FIREWALL_DEMO_PORT: ${FIREWALL_DEMO_PORT:-${API_PORT:-8000}}
      NETWORK_INTERFACE: ${NETWORK_INTERFACE:-eth0}
    restart: unless-stopped
